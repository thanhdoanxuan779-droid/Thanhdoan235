<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>XS Việt Nam - Cầu</title>

<style>

.cau-board{position:relative}
.cau-column{position:relative;z-index:1}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eef1f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button,input,textarea{font-family:inherit}
button{border:0;outline:0}

.app{
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ================= CHỌN ĐÀI ================= */

#stationScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  height:44px;
  flex:none;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 8px;
}

.user{
  padding:5px 9px;
  border-radius:14px;
  background:#f1f3f6;
  color:#777;
  font-size:9px;
}

.header-icons{
  display:flex;
  gap:4px;
}

.h-icon{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#f2f3f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.station-title{
  height:30px;
  flex:none;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  padding-left:8px;
  color:#159eea;
  font-size:9px;
  font-weight:900;
}

.station-content{
  flex:1;
  min-height:0;
  display:flex;
  gap:4px;
  padding:4px;
  overflow:hidden;
}

.region-sidebar{
  width:62px;
  flex:none;
  background:#fff;
  border-radius:7px;
  overflow:hidden;
}

.region-btn{
  width:100%;
  height:64px;
  padding:2px;
  background:#fff;
  color:#666;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:6.5px;
  line-height:8px;
  font-weight:800;
}

.region-btn.active{
  color:#159eea;
  background:#e7f6ff;
  border-left:3px solid #159eea;
}

.region-icon{
  width:20px;
  height:20px;
  border:1px solid #aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5.5px;
}

.stations{
  flex:1;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.station-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
}

.station-card{
  position:relative;
  height:70px;
  background:#fff;
  border-radius:8px;
  text-align:left;
  padding:6px;
}

.station-card:active{transform:scale(.98)}

.station-number{
  color:#159eea;
  font-size:7px;
  font-weight:900;
}

.station-name{
  margin-top:3px;
  font-size:10px;
  font-weight:900;
}

.station-day{
  margin-top:3px;
  color:#888;
  font-size:6.5px;
}

.station-circle{
  position:absolute;
  right:5px;
  bottom:5px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#e6f6ff;
  color:#159eea;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5.5px;
  font-weight:900;
}

/* ================= MÀN CẦU ================= */

#cauScreen{
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
  padding:4px;
}

.cau-header{
  height:34px;
  flex:none;
  background:#fff;
  border-radius:7px;
  display:flex;
  align-items:center;
  padding:2px 4px;
  margin-bottom:4px;
}

.back{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#f1f2f5;
  color:#555;
  font-size:20px;
}

.cau-station{margin-left:5px}

.cau-station strong{
  display:block;
  font-size:10px;
  font-weight:900;
}

.cau-station span{
  display:block;
  color:#888;
  font-size:6.5px;
}

/* ================= KẾT QUẢ ================= */

.result-top{
  width:100%;
  flex:none;
  margin-bottom:4px;
  background:#fff;
  border:1px solid #cfd5dc;
  border-radius:7px;
  overflow:hidden;
}

.result-date-row{
  width:100%;
  height:29px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #cfd5dc;
}

.result-date{
  color:#777;
  font-size:11px;
  font-weight:800;
}

.result-columns{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.result-box{
  min-width:0;
  background:#fff;
  overflow:hidden;
}

#dbResult{
  border-right:1px solid #cfd5dc;
}

.result-title{
  width:100%;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}

#dbResult .result-title{
  color:#d00000;
}

#g1Result .result-title{
  color:#111;
}

.result-current{
  width:100%;
  height:39px;
  min-height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.result-number{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:39px;
  font-size:19px;
  line-height:39px;
  font-weight:900;
  letter-spacing:1px;
}

#dbNumber{
  color:#d00000;
}

#g1Number{
  color:#111;
}

.history{
  display:none;
  max-height:150px;
  overflow-y:auto;
}

.result-box.open .result-current{
  display:none;
}

.result-box.open .history{
  display:block;
}

.history-row{
  height:22px;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

.history-number{
  font-size:9px;
  font-weight:900;
  min-width:48px;
  text-align:left;
}

.history-date{
  width:75px;
  color:#888;
  font-size:7px;
  text-align:right;
  margin-right:7px;
}

#dbHistory .history-number{
  color:#d00000;
}

#g1History .history-number{
  color:#111;
}

/* ================= NHẬP ================= */

.open-input{
  width:100%;
  height:27px;
  flex:none;
  margin-bottom:4px;
  border-radius:6px;
  background:#fff;
  color:#159eea;
  font-size:7px;
  font-weight:900;
}

.cau-main{
  flex:1;
  min-height:0;
  display:flex;
  gap:4px;
}

.position-column{
  width:50px;
  flex:none;
  background:#fff;
  border-radius:7px;
  overflow-y:auto;
  overflow-x:hidden;
}

.position-btn{
  width:100%;
  height:37px;
  min-height:37px;
  padding:2px;
  background:#fff;
  color:#555;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:7px;
  line-height:15px;
  font-weight:800;
}

.position-btn[data-pos="dbTruc"],
.position-btn[data-pos="dbDv"],
.position-btn[data-pos="dbSum2Last"]{
  color:#f00;
}

.position-btn.active{
  background:#e7f6ff;
  color:#159eea;
  border-left:3px solid #159eea;
}

.cau-right{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.cau-tabs{
  flex:none;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.cau-tab{
  height:28px;
  border-radius:6px;
  background:#fff;
  color:#666;
  font-size:7px;
  font-weight:900;
}

.cau-tab.active{
  background:#159eea;
  color:#fff;
}

.cau-content{
  flex:1;
  min-height:0;
  margin-top:3px;
  background:#dff3ff;
  border-radius:7px;
  overflow:auto;
  padding:6px;
  direction:rtl;
}

.cau-title{
  text-align:center;
  color:#159eea;
  font-size:7.5px;
  font-weight:900;
  margin-bottom:6px;
  display:none;
}

/* ================= DỰ ĐOÁN ================= */

.predict-area{
  width:100%;
  margin-bottom:5px;
}

.predict-buttons{
  display:flex;
  gap:5px;
}

.predict-buttons button{
  width:80px;
  height:28px;
  padding:0;
  border:1px solid #159eea;
  border-radius:5px;
  background:#fff;
  color:#159eea;
  font-size:9px;
  font-weight:700;
}

.predict-buttons button.flash{
  animation:buttonFlash .12s ease;
}

@keyframes buttonFlash{
  0%{
    background:#eaf7ff;
    color:#159eea;
  }
  100%{
    background:#fff;
    color:#159eea;
  }
}

.predict-stats{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:4px;
  min-height:12px;
  font-size:7px;
  font-weight:900;
  color:#555;
}

.predict-mark{
  position:absolute;
  z-index:100;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:24px;
  font-weight:900;
  pointer-events:none;
  animation:predictionBlink .55s steps(1,end) infinite;
}

@keyframes predictionBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}

.predict-mark.t{color:#e53935}
.predict-mark.x{color:#168bd0}

/* ================= CARO ================= */

.cau-board{
  position:relative;
  width:max-content;
  min-width:100%;
  display:flex;
  align-items:flex-start;
  gap:3px;
  border:1px solid rgba(21,158,234,.65);
  border-radius:4px;
  background-color:#cfeeff;
  background-image:
    linear-gradient(
      rgba(21,158,234,.22) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(21,158,234,.22) 1px,
      transparent 1px
    );
  background-size:27px 27px;
  background-position:0 0;
  padding-right:3px;
  direction:ltr;
}

.cau-column{
  width:24px;
  min-width:24px;
  display:flex;
  flex-direction:column;
  gap:3px;
  transform:translateX(1.5px);
}

.cau-cell{
  width:24px;
  height:24px;
  min-width:24px;
  min-height:24px;
  border-radius:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:24px;
  font-weight:900;
  padding:0;
  margin:0;
}

.tai,.le,.prime{
  color:#e53935;
  background:transparent;
}

.xiu,.chan,.composite{
  color:#168bd0;
  background:transparent;
}

/* ================= MÀN NHẬP ================= */

#inputScreen{
  display:none;
  position:absolute;
  z-index:50;
  inset:4px;
  background:#eef1f5;
  flex-direction:column;
}

.input-header{
  height:34px;
  flex:none;
  background:#fff;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px 5px;
  margin-bottom:4px;
}

.input-header-title{
  color:#159eea;
  font-size:9px;
  font-weight:900;
}

.input-close{
  height:25px;
  padding:0 9px;
  border-radius:5px;
  background:#f0f1f4;
  color:#555;
  font-size:7px;
  font-weight:900;
}

.input-area{
  flex:1;
  min-height:0;
  background:#fff;
  border-radius:7px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.input-titles{
  width:100%;
  height:27px;
  flex:none;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border-bottom:1px solid #eee;
  box-sizing:border-box;
}

.input-title{
  min-width:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7.5px;
  font-weight:900;
  box-sizing:border-box;
}

.input-title:first-child{
  color:#159eea;
}

.input-title:nth-child(2){
  color:#d00000;
}

.input-title:last-child{
  color:#111;
}

.input-scroll{
  width:100%;
  flex:1;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  box-sizing:border-box;
}

.input-grid{
  display:flex;
  flex-direction:column;
  width:100%;
  min-width:0;
  max-width:100%;
  padding:4px;
  gap:4px;
  box-sizing:border-box;
}

.input-row-horizontal{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:0;
  align-items:center;
  box-sizing:border-box;
  border:1px solid #cfd5dc;
  border-radius:6px;
  overflow:hidden;
  background:#fff;
}

.input-row-horizontal .data-row{
  width:100%;
  min-width:0;
  max-width:100%;
  height:37px;
  margin:0;
  overflow:hidden;
  box-sizing:border-box;
  border-right:1px solid #cfd5dc;
}

.input-row-horizontal .data-row:last-child{
  border-right:0;
}

.date-input{
  width:100%;
  height:35px;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:#fff;
  color:#159eea;
  text-align:center;
  font-size:20px;
  font-weight:900;
  box-sizing:border-box;
}

.row-input{
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  height:35px;
  min-height:35px;
  resize:none;
  overflow:hidden;
  padding:0 3px;
  border:0;
  border-radius:0;
  outline:none;
  background:#fff;
  text-align:center;
  font-size:20px;
  line-height:31px;
  font-weight:900;
  letter-spacing:1px;
  caret-color:#159eea;
  box-sizing:border-box;
}

.row-input.db-input{
  color:#d00000;
  border:0;
}

.row-input.g1-input{
  color:#111;
  border:0;
}

.row-input.locked{
  cursor:not-allowed;
  opacity:1;
}

.row-input.db-input.locked{
  background:#ffecec;
}

.row-input.g1-input.locked{
  background:#eeeeee;
}

#dbInputColumn .row-input.locked{
  background:#ffecec;
}

#g1InputColumn .row-input.locked{
  background:#eeeeee;
}

.add-area{
  height:38px;
  flex:none;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:4px;
}

.add-btn{
  height:29px;
  border-radius:5px;
  background:#159eea;
  color:#fff;
  font-size:7px;
  font-weight:900;
}

@media(max-width:380px){

  .region-sidebar{
    width:59px;
  }

  .position-column{
    width:58px;
  }

  .position-btn{
    font-size:6px;
  }

  .row-input{
    font-size:19px;
  }

}

</style>
</head>

<body>

<div class="app">

<section id="stationScreen">

  <div class="header">

    <div class="user">
      Xin chào
    </div>

    <div class="header-icons">
      <div class="h-icon">💬</div>
      <div class="h-icon">♜</div>
    </div>

  </div>

  <div class="station-title" id="regionTitle">
    XS MIỀN BẮC VN
  </div>

  <div class="station-content">

    <aside class="region-sidebar">

      <button type="button" class="region-btn active" data-region="mb">
        <div class="region-icon">MB</div>
        <span>XS Miền Bắc VN</span>
      </button>

      <button type="button" class="region-btn" data-region="mt">
        <div class="region-icon">MT</div>
        <span>SX Miền Trung VN</span>
      </button>

      <button type="button" class="region-btn" data-region="mn">
        <div class="region-icon">MN</div>
        <span>SX Miền Nam VN</span>
      </button>

    </aside>

    <main class="stations">
      <div class="station-grid" id="stationGrid"></div>
    </main>

  </div>

</section>

<section id="cauScreen">

  <div class="cau-header">

    <button type="button" class="back" id="backBtn">
      ‹
    </button>

    <div class="cau-station">
      <strong id="stationName"></strong>
      <span id="stationDay"></span>
    </div>

  </div>

  <div class="result-top">

    <div class="result-date-row">
      <span class="result-date" id="resultDate"></span>
    </div>

    <div class="result-columns">

      <div class="result-box" id="dbResult">

        <div class="result-title">
          GIẢI ĐẶC BIỆT
        </div>

        <div class="result-current">
          <span class="result-number" id="dbNumber">—</span>
        </div>

        <div class="history" id="dbHistory"></div>

      </div>

      <div class="result-box" id="g1Result">

        <div class="result-title">
          GIẢI NHẤT
        </div>

        <div class="result-current">
          <span class="result-number" id="g1Number">—</span>
        </div>

        <div class="history" id="g1History"></div>

      </div>

    </div>

  </div>

  <button type="button" class="open-input" id="openInput">
    NHẬP DỮ LIỆU
  </button>

  <div class="cau-main">

    <div class="position-column">

      <!-- ================= GIẢI ĐẶC BIỆT ================= -->

      <button type="button" class="position-btn db-tram-ngan" data-pos="dbTramNgan">
        <span>Giải ĐB</span>
        <span>TRĂM NGÀN</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbVan">
        <span>Giải ĐB</span>
        <span>VẠN</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbNgan">
        <span>Giải ĐB</span>
        <span>NGÀN</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbTram">
        <span>Giải ĐB</span>
        <span>TRĂM</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbTruc">
        <span>Giải ĐB</span>
        <span>TRỤC</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbDv">
        <span>Giải ĐB</span>
        <span>ĐƠN VỊ</span>
      </button>

      <button type="button" class="position-btn db-six-only" data-pos="dbSum2First">
        <span>TỔNG 2 SỐ</span>
        <span>ĐẦU ĐB</span>
      </button>

      <button type="button" class="position-btn db-six-only" data-pos="dbSum3First">
        <span>TỔNG 3 SỐ</span>
        <span>ĐẦU ĐB</span>
      </button>

      <button type="button" class="position-btn db-six-only" data-pos="dbSum4First">
        <span>TỔNG 4 SỐ</span>
        <span>ĐẦU ĐB</span>
      </button>

      <button type="button" class="position-btn db-six-only" data-pos="dbSum5First">
        <span>TỔNG 5 SỐ</span>
        <span>ĐẦU ĐB</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbSum2Last">
        <span>TỔNG 2 SỐ</span>
        <span>CUỐI ĐB</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbSum3Last">
        <span>TỔNG 3 SỐ</span>
        <span>CUỐI ĐB</span>
      </button>

      <button type="button" class="position-btn" data-pos="dbSum4Last">
        <span>TỔNG 4 SỐ</span>
        <span>CUỐI ĐB</span>
      </button>

      <button type="button" class="position-btn db-six-only" data-pos="dbSum5Last">
        <span>TỔNG 5 SỐ</span>
        <span>CUỐI ĐB</span>
      </button>

      <button type="button" class="position-btn db-six-only" data-pos="dbSum6">
        <span>TỔNG 6 SỐ</span>
        <span>ĐB</span>
      </button>

      <button type="button" class="position-btn db-five-only" data-pos="dbSum5">
        <span>TỔNG 5 SỐ</span>
        <span>ĐB</span>
      </button>

      <!-- ================= GIẢI NHẤT ================= -->

      <button type="button" class="position-btn" data-pos="g1Van">
        <span>Giải Nhất</span>
        <span>VẠN</span>
      </button>

      <button type="button" class="position-btn" data-pos="g1Ngan">
        <span>Giải Nhất</span>

      .replace(/đ/g,"d")
      .toLowerCase()
      .replace(/\./g,"")

      .trim();

  if(a===b){

  }

    "ho chi minh":"tp ho chi minh",
    "thua thien hue":"hue",
    "hue":"thua thien hue"
  };

  );

}

function workerDateToIso(date){

  const s=String(date||"").trim();

  if(!s){
    return "";
  }

  /* ISO: 2026-09-08 */
  let m=s.match(
    /^(\d{4})-(\d{1,2})-(\d{1,2})/
  );

  if(m){

    return (
      m[1]+"-"+
      String(m[2]).padStart(2,"0")+"-"+
      String(m[3]).padStart(2,"0")
    );

  }

  /* DD/MM/YYYY hoặc DD-MM-YYYY */
  m=s.match(
    /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
  );

  if(m){

    return (
      m[3]+"-"+
      String(m[2]).padStart(2,"0")+"-"+
      String(m[1]).padStart(2,"0")
    );

  }

  return "";

}


function validNumberFor(
  type,
  number,
  region
){

  const value=
    String(number||"")
      .replace(/\D/g,"");

  const r=
    String(region||"").toLowerCase();

  let len=5;

  if(
    type==="db" &&
    (
      r==="mt" ||
      r==="mn"
    )
  ){
    len=6;
  }

  if(type==="g1"){
    len=5;
  }

  return (
    new RegExp(
      "^\\d{"+len+"}$"
    ).test(value)
  );

}


function getWorkerPrizeType(prize){

  const s=
    String(prize||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/\s+/g," ")
      .trim();

  if(
    s==="db" ||
    s==="d.b" ||
    s.includes("dac biet") ||
    s.includes("giai db") ||
    s.includes("giai dac biet")
  ){

    return "db";

  }

  if(
    s==="1" ||
    s==="g1" ||
    s==="g.1" ||
    s.includes("giai nhat") ||
    s.includes("giai 1")
  ){

    return "g1";

  }

  return "";

}


function ensureStoreKey(
  all,
  key
){

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  if(!Array.isArray(all[key].db)){
    all[key].db=[];
  }

  if(!Array.isArray(all[key].g1)){
    all[key].g1=[];
  }

  return all[key];

}


function findFrontendStation(
  region,
  day,
  workerStation
){

  const r=
    String(region||"")
      .toLowerCase();

  const d=
    String(day||"")
      .toUpperCase();

  const target=
    normalize(workerStation);

  const info=
    STATIONS[r];

  if(!info || !info.days[d]){
    return "";
  }

  const found=
    info.days[d].find(item=>{

      const local=
        normalize(item[0]);

      return (
        local===target ||
        stationOnlineMatch(
          item[0],
          workerStation
        )
      );

    });

  return found
    ?found[0]
    :"";

}


function upsertWorkerPrize(
  all,
  type,
  number,
  isoDate,
  sourceDate,
  region,
  station
){

  const r=
    String(region||"")
      .toLowerCase();

  const day=
    getDateDayCode(isoDate);

  if(!day){
    return false;
  }

  const localStation=
    findFrontendStation(
      r,
      day,
      station
    );

  if(!localStation){
    return false;
  }

  const key=[
    r,
    day,
    localStation
  ].join("|");

  const data=
    ensureStoreKey(
      all,
      key
    );

  const value=
    String(number||"")
      .replace(/\D/g,"");

  if(
    !validNumberFor(
      type,
      value,
      r
    )
  ){
    return false;
  }

  const arr=
    type==="db"
      ?data.db
      :data.g1;

  const existing=
    arr.find(
      x=>
        x &&
        x.online===true &&
        String(x.sourceDate||"")===isoDate
    );

  const created=
    new Date(
      isoDate+"T00:00:00+07:00"
    ).getTime();

  if(existing){

    /*
     * Nếu Worker có kết quả mới cho cùng ngày
     * thì cập nhật số, không tạo dòng trùng.
     */
    existing.number=value;
    existing.locked=true;
    existing.created=created;
    existing.sourceDate=isoDate;
    existing.sourceDateText=
      sourceDate ||
      (
        isoDate.split("-").reverse().join("/")
      );
    existing.online=true;
    existing.region=r;
    existing.province=localStation;

    return true;

  }

  arr.push({

    id:
      "online_"+
      type+
      "_"+
      isoDate,

    rowId:
      "online_"+
      isoDate,

    number:value,

    locked:true,

    created:created,

    sourceDate:isoDate,

    sourceDateText:
      sourceDate ||
      isoDate.split("-").reverse().join("/"),

    online:true,

    region:r,

    province:localStation

  });

  return true;

}

function sortOnlineStore(all){

  Object.keys(all||{})
    .forEach(key=>{

      const data=
        all[key];

      if(!data){
        return;
      }

      ["db","g1"].forEach(type=>{

        if(!Array.isArray(data[type])){
          data[type]=[];
        }

        data[type].sort(
          (a,b)=>
            (
              Number(b?.created)||0
            )-
            (
              Number(a?.created)||0
            )
        );

      });

    });

}

async function syncOnlineResults(){
  try{
    const url = AUTO_KQ_API + "/latest?t=" + Date.now();

    const res = await fetch(url, {
      method:"GET",
      cache:"no-store"
    });

    if(!res.ok){
      console.log("Worker lỗi:", res.status);
      return;
    }

    const data = await res.json();

    if(!data || !data.ok || !Array.isArray(data.results)){
      console.log("Worker không có dữ liệu hợp lệ");
      return;
    }

    const all = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "{}"
    );

    let accepted = 0;

    for(const item of data.results){

      if(!item) continue;

      const region = String(item.region || "").toUpperCase();
      const station = String(item.station || "").trim();
      const date = workerDateToIso(item.date);

      if(!region || !station || !date) continue;

      const day = getDateDayCode(date);

      if(!day) continue;

      const key = [
        region,
        day,
        station
      ].join("|");

      ensureStoreKey(all,key);

      /*
       * Worker dạng từng dòng:
       * prize + number
       */
      if(item.prize && item.number != null){

        const type = getWorkerPrizeType(item.prize);

        if(type && validNumberFor(type,item.number,region)){

          upsertWorkerPrize(
            all,
            type,
            String(item.number),
            date,
            item.date,
            region,
            station
          );

          accepted++;
        }

        continue;
      }

      /*
       * Hỗ trợ luôn Worker dạng nhóm:
       * {db: "...", g1: "..."}
       */
      if(item.db != null || item.g1 != null){

        upsertWorkerGrouped(all,{
          region,
          station,
          date,
          db:item.db,
          g1:item.g1,
          source:item.source || ""
        });

        accepted++;
      }
    }

    sortOnlineStore(all);

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(all)
    );

    console.log(
      "Đồng bộ Worker:",
      data.results.length,
      "dòng / nhận:",
      accepted
    );

    if(
      typeof cauScreen !== "undefined" &&
      cauScreen &&
      !cauScreen.classList.contains("hidden")
    ){
      if(
        typeof currentRegion !== "undefined" &&
        typeof currentDay !== "undefined" &&
        typeof currentStation !== "undefined"
      ){
        renderCau();
      }
    }

  }catch(err){
    console.log("Lỗi đồng bộ Worker:",err);
  }
}

function getIsoDateForCurrentDay(){

  if(currentDay){

    const now=
      new Date();

    const current=
      getDateDayCode(
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone:"Asia/Ho_Chi_Minh",
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
          }
        ).format(now)
      );

    if(current===currentDay){

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:"Asia/Ho_Chi_Minh",
          year:"numeric",
          month:"2-digit",
          day:"2-digit"
        }
      ).format(now);

    }

    const target=
      {
        T2:1,
        T3:2,
        T4:3,
        T5:4,
        T6:5,
        T7:6,
        CN:0
      }[currentDay];

    const d=
      new Date(now);

    const diff=
      (target-d.getDay()+7)%7;

    d.setDate(
      d.getDate()-diff
    );

    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).format(d);

  }

  const now=
    new Date();

  const parts=
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(now);

  const obj={};

  parts.forEach(p=>{

    if(p.type!=="literal"){
      obj[p.type]=p.value;
    }

  });

  return (
    obj.year+
    "-"+
    obj.month+
    "-"+
    obj.day
  );

}

function ensureCurrent(){

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

    saveAll(all);

  }

  const current=
    all[key];

  if(!Array.isArray(current.db)){
    current.db=[];
  }

  if(!Array.isArray(current.g1)){
    current.g1=[];
  }

  let changed=false;

  function normalizeArray(arr,type){

    const len=
      digitLength(type);

    const re=
      new RegExp(
        "^\\d{"+len+"}$"
      );

    arr.forEach(
      (item,i)=>{

        if(
          !item ||
          typeof item!=="object"
        ){
          return;
        }

        if(!item.id){

          item.id=
            "old_"+
            Date.now()+
            "_"+
            Math.random()
              .toString(36)
              .slice(2)+
            "_"+
            i;

          changed=true;

        }

        if(!item.rowId){

          item.rowId=
            "legacy_"+i;

          changed=true;

        }

        if(
          typeof item.created!=="number"
        ){

          item.created=
            i+1;

          changed=true;

        }

        if(
          typeof item.locked!=="boolean"
        ){

          item.locked=
            re.test(
              String(item.number||"")
            );

          changed=true;

        }

      }
    );

  }

  normalizeArray(
    current.db,
    "db"
  );

  normalizeArray(
    current.g1,
    "g1"
  );

  if(changed){
    saveAll(all);
  }

  return current;

}

function newest(list,type){

  const len=
    digitLength(type);

  const re=
    new RegExp(
      "^\\d{"+len+"}$"
    );

  return (list||[])
    .filter(
      x=>
        x &&
        re.test(
          String(x.number||"")
        )
    )
    .slice()
    .sort(
      (a,b)=>{

        return (
          (Number(b.created)||0)-
          (Number(a.created)||0)
        );

      }
    );

}

function getDigits(){

  const data=
    ensureCurrent();

  const sumPositions=[

    "dbSum2First",
    "dbSum3First",
    "dbSum4First",
    "dbSum5First",
    "dbSum2Last",
    "dbSum3Last",
    "dbSum4Last",
    "dbSum5Last",
    "dbSum6",

    "dbSum5",

    "g1Sum2First",
    "g1Sum3First",
    "g1Sum4First",
    "g1Sum2Last",
    "g1Sum3Last",
    "g1Sum4Last",
    "g1Sum5"

  ];

  if(
    sumPositions.includes(
      currentPosition
    )
  ){

    const isDB=
      currentPosition.startsWith("db");

    const list=
      isDB
        ?newest(
          data.db,
          "db"
        )
        :newest(
          data.g1,
          "g1"
        );

    const isSixDB=
      isDB &&
      digitLength("db")===6;

    function calcSum(number){

      const s=
        String(number||"");

      const len=
        isDB
          ?digitLength("db")
          :5;

      if(
        !new RegExp(
          "^\\d{"+len+"}$"
        ).test(s)
      ){
        return null;
      }

      let total=0;

      let offset=
        isSixDB
          ?1
          :0;

      if(
        currentPosition==="dbSum2First" ||
        currentPosition==="g1Sum2First"
      ){

        total=
          Number(s[offset])+
          Number(s[offset+1]);

      }

      else if(
        currentPosition==="dbSum3First" ||
        currentPosition==="g1Sum3First"
      ){

        total=
          Number(s[offset])+
          Number(s[offset+1])+
          Number(s[offset+2]);

      }

      else if(
        currentPosition==="dbSum4First" ||
        currentPosition==="g1Sum4First"
      ){

        total=
          Number(s[offset])+
          Number(s[offset+1])+
          Number(s[offset+2])+
          Number(s[offset+3]);

      }

      else if(
        currentPosition==="dbSum5First"
      ){

        total=
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4])+
          Number(s[5]);

      }

      else if(
        currentPosition==="dbSum2Last" ||
        currentPosition==="g1Sum2Last"
      ){

        total=
          Number(s[len-2])+
          Number(s[len-1]);

      }

      else if(
        currentPosition==="dbSum3Last" ||
        currentPosition==="g1Sum3Last"
      ){

        total=
          Number(s[len-3])+
          Number(s[len-2])+
          Number(s[len-1]);

      }

      else if(
        currentPosition==="dbSum4Last" ||
        currentPosition==="g1Sum4Last"
      ){

        total=
          Number(s[len-4])+
          Number(s[len-3])+
          Number(s[len-2])+
          Number(s[len-1]);

      }

      else if(
        currentPosition==="dbSum5Last"
      ){

        total=
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4])+
          Number(s[5]);

      }

      else if(
        currentPosition==="dbSum6"
      ){

        total=
          Number(s[0])+
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4])+
          Number(s[5]);

      }

      else if(
        currentPosition==="dbSum5"
      ){

        total=
          Number(s[0])+
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4]);

      }

      else if(
        currentPosition==="g1Sum5"
      ){

        total=
          Number(s[0])+
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4]);

      }

      return String(
        total%10
      );

    }

    return list
      .map(
        x=>
          calcSum(x.number)
      )
      .filter(
        x=>x!==null
      );

  }

  const map={

    dbTramNgan:0,
    dbVan:1,
    dbNgan:2,
    dbTram:3,
    dbTruc:4,
    dbDv:5,

    g1Van:0,
    g1Ngan:1,
    g1Tram:2,
    g1Truc:3,
    g1Dv:4

  };

  /*
   * MB dùng mapping 5 số:
   * Vạn 0 / Ngàn 1 / Trăm 2 / Trục 3 / ĐV 4
   */
  if(
    currentRegion==="mb" &&
    currentPosition.startsWith("db")
  ){

    const mbMap={
      dbVan:0,
      dbNgan:1,
      dbTram:2,
      dbTruc:3,
      dbDv:4
    };

    const mbIndex=
      mbMap[currentPosition];

    if(mbIndex===undefined){
      return [];
    }

    return newest(
      data.db,
      "db"
    )
      .map(
        x=>
          x.number[mbIndex]
      )
      .filter(
        x=>
          x!==undefined
      );

  }

  const index=
    map[currentPosition];

  if(index===undefined){
    return [];
  }

  const isDB=
    currentPosition.startsWith("db");

  const list=
    isDB
      ?newest(
        data.db,
        "db"
      )
      :newest(
        data.g1,
        "g1"
      );

  return list
    .map(
      x=>
        x.number[index]
    )
    .filter(
      x=>
        x!==undefined
    );

}

function classifyDigit(digit){

  const n=
    String(digit);

  if(currentType==="tx"){

    return [
      "5","6","7","8","9"
    ].includes(n)
      ?"T"
      :"X";

  }

  if(currentType==="cl"){

    return [
      "0","2","4","6","8"
    ].includes(n)
      ?"E"
      :"O";

  }

  if(currentType==="ps"){

    return [
      "1","2","3","5","7"
    ].includes(n)
      ?"P"
      :"C";

  }

  return "";

}

function buildBridge(values){

  const ROWS=6;
  const board=[];

  if(
    !Array.isArray(values) ||
    !values.length
  ){
    return board;
  }

  function occupied(r,c){

    return !!(
      board[r] &&
      board[r][c]!==undefined
    );

  }

  function put(r,c,v){

    if(!board[r]){
      board[r]=[];
    }

    board[r][c]=v;

  }

  const runs=[];

  let value=
    values[0];

  let count=1;

  for(
    let i=1;
    i<values.length;
    i++
  ){

    if(values[i]===value){

      count++;

    }else{

      runs.push({
        value:value,
        count:count
      });

      value=
        values[i];

      count=1;

    }

  }

  runs.push({
    value:value,
    count:count
  });

  let startCol=0;

  runs.forEach(run=>{

    let r=0;
    let c=startCol;
    let remain=run.count;
    let horizontal=false;

    while(remain>0){

      while(occupied(r,c)){
        c++;
      }

      put(
        r,
        c,
        run.value
      );

      remain--;

      if(remain<=0){
        break;
      }

      if(horizontal){

        c++;

        while(occupied(r,c)){
          c++;
        }

        continue;

      }

      if(
        r+1<ROWS &&
        !occupied(r+1,c)
      ){

        r++;

      }else{

        horizontal=true;

        c++;

        while(occupied(r,c)){
          c++;
        }

      }

    }

    startCol++;

  });

  return board;

}

   TÌM TỌA ĐỘ TAY TIẾP THEO
===================================================== */

function getPredictionPosition(
  values,
  predictedValue
){

  if(
    !Array.isArray(values) ||
    !values.length ||
    !predictedValue
  ){
    return null;
  }

  const ROWS=6;

  const testValues=
    values.concat(
      predictedValue
    );

  const board=[];

  function occupied(r,c){

    return !!(
      board[r] &&
      board[r][c]!==undefined
    );

  }

  function put(r,c,v){

    if(!board[r]){
      board[r]=[];
    }

    board[r][c]=v;

  }

  const runs=[];

  let value=
    testValues[0];

  let count=1;

  for(
    let i=1;
    i<testValues.length;
    i++
  ){

    if(testValues[i]===value){

      count++;

    }else{

      runs.push({
        value:value,
        count:count
      });

      value=
        testValues[i];

      count=1;

    }

  }

  runs.push({
    value:value,
    count:count
  });

  let startCol=0;
  let lastPosition=null;

  for(const run of runs){

    let r=0;
    let c=startCol;
    let remain=run.count;
    let horizontal=false;

    while(remain>0){

      while(occupied(r,c)){
        c++;
      }

      put(
        r,
        c,
        run.value
      );

      lastPosition={
        row:r,
        col:c
      };

      remain--;

      if(remain<=0){
        break;
      }

      if(horizontal){

        c++;

        while(occupied(r,c)){
          c++;
        }

        continue;

      }

      if(
        r+1<ROWS &&
        !occupied(r+1,c)
      ){

        r++;

      }else{

        horizontal=true;

        c++;

        while(occupied(r,c)){
          c++;
        }

      }

    }

    startCol++;

  }

  return lastPosition;

}

function updatePredictionStats(){

  const digits=
    getDigits();

  if(!digits.length){

    predictStats.innerHTML="";

    return;

  }

  const values=
    digits.map(
      classifyDigit
    );

  if(currentType==="tx"){

    const t=
      values.filter(
        x=>x==="T"
      ).length;

    const x=
      values.filter(
        x=>x==="X"
      ).length;

    const total=
      t+x;

    const tp=
      total
        ?Math.round(t/total*100)
        :0;

    const xp=
      total
        ?Math.round(x/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        B: ${t} lần — ${tp}%
      </span>
      <span>
        S: ${x} lần — ${xp}%
      </span>
    `;

    return;

  }

  if(currentType==="cl"){

    const c=
      values.filter(
        x=>x==="E"
      ).length;

    const l=
      values.filter(
        x=>x==="O"
      ).length;

    const total=
      c+l;

    const cp=
      total
        ?Math.round(c/total*100)
        :0;

    const lp=
      total
        ?Math.round(l/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        C: ${c} lần — ${cp}%
      </span>
      <span>
        L: ${l} lần — ${lp}%
      </span>
    `;

    return;

  }

  if(currentType==="ps"){

    const s=
      values.filter(
        x=>x==="P"
      ).length;

    const h=
      values.filter(
        x=>x==="C"
      ).length;

    const total=
      s+h;

    const sp=
      total
        ?Math.round(s/total*100)
        :0;

    const hp=
      total
        ?Math.round(h/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        SNT: ${s} lần — ${sp}%
      </span>

      <span>
        SH: ${h} lần — ${hp}%
      </span>

    `;

  }

}

===================================================== */

function drawCau(){

  updatePredictionButtons();

  if(currentType==="tx"){

    cauTitle.textContent=
      "CẦU TÀI / XỈU";

  }

  else if(currentType==="cl"){

    cauTitle.textContent=
      "CẦU CHẴN / LẺ";

  }

  else if(currentType==="ps"){

    cauTitle.textContent=
      "CẦU SNT / SH";

  }

  const digits=
    getDigits();

  updatePredictionStats();

  cauArea.innerHTML="";

  if(!digits.length){

    cauArea.innerHTML=`

      <div class="no-data">
        Chưa có dữ liệu
      </div>

    `;

    return;

  }

  const values=
    digits
      .slice()
      .reverse()
      .map(
        classifyDigit
      );

  const bridge=
    buildBridge(values);

  const board=
    document.createElement("div");

  board.className="cau-board";

  let maxCols=0;

  for(
    let r=0;
    r<6;
    r++
  ){

    if(
      bridge[r] &&
      bridge[r].length>maxCols
    ){

      maxCols=
        bridge[r].length;

    }

  }

  for(
    let c=0;
    c<maxCols;
    c++
  ){

    const column=
      document.createElement("div");

    column.className=
      "cau-column";

    let hasCell=false;

    for(
      let r=0;
      r<6;
      r++
    ){

      const value=
        bridge[r] &&
        bridge[r][c];

      if(value){

        column.appendChild(
          makeCell(value)
        );

        hasCell=true;

      }else{

        const empty=
          document.createElement("div");

        empty.style.width="24px";
        empty.style.height="24px";
        empty.style.flex="none";

        column.appendChild(empty);

      }

    }

    if(hasCell){

      board.appendChild(column);

    }

  }

  for(
    let i=0;
    i<4;
    i++
  ){

    const emptyColumn=
      document.createElement("div");

    emptyColumn.className=
      "cau-column";

    for(
      let r=0;
      r<6;
      r++
    ){

      const empty=
        document.createElement("div");

      empty.style.width="24px";
      empty.style.height="24px";
      empty.style.flex="none";

      emptyColumn.appendChild(empty);

    }

    board.appendChild(
      emptyColumn
    );

  }

  if(
    prediction==="T" ||
    prediction==="X" ||
    prediction==="E" ||
    prediction==="O" ||
    prediction==="P" ||
    prediction==="C"
  ){

    const nextPos=
      getPredictionPosition(
        values,
        prediction
      );

    if(nextPos){

      const mark=
        document.createElement("div");

      mark.className=
        "predict-mark";

      if(
        prediction==="T" ||
        prediction==="O" ||
        prediction==="P"
      ){

        mark.classList.add("t");

      }else{

        mark.classList.add("x");

      }

      mark.textContent=
        prediction==="T"
          ?"B"
          :prediction==="X"
            ?"S"
            :prediction;

      mark.style.left=
        (
          nextPos.col*27+
          1.5+
          1
        )+
        "px";

      mark.style.top=
        (
          nextPos.row*27+
          1
        )+
        "px";

      board.appendChild(mark);

    }

  }

  cauArea.appendChild(board);

}

/* =====================================================
   BUILD ROWS
===================================================== */

function buildRows(){

  const data=
    ensureCurrent();

  const map=
    new Map();

  function add(arr,type){

    arr.forEach(
      (item,index)=>{

        if(!item){
          return;
        }

        let rowId=
          item.rowId;

        if(!rowId){

          rowId=
            "legacy_"+index;

          item.rowId=
            rowId;

        }

        if(!map.has(rowId)){

          map.set(
            rowId,
            {
              rowId:rowId,
              db:null,
              g1:null,
              created:
                Number(item.created)||
                index+1
            }
          );

        }

        const row=
          map.get(rowId);

        row[type]=
          item;

        row.created=
          Math.max(
            Number(row.created)||0,
            Number(item.created)||0
          );

      }
    );

  }

  add(data.db,"db");
  add(data.g1,"g1");

  return Array
    .from(map.values())
    .sort(
      (a,b)=>
        (Number(b.created)||0)-
        (Number(a.created)||0)
    );

}

){

    );

  return String(text||"")

    .replace(/\n/g," ")
    .split(/[\s,;]+/)
    .map(x=>x.trim())

    );

}

/* =====================================================
   PASTE DÀN
===================================================== */

function pasteNumbers(
  type,
  startRowId,
  numbers
){

  if(
    !numbers ||
    !numbers.length
  ){
    return;
  }

  const maxDigits=
    digitLength(type);

  const re=
    new RegExp(
      "^\\d{"+maxDigits+"}$"
    );

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  const data=
    all[key];

  let rows=
    buildRowsFromData(data);

  let startIndex=
    rows.findIndex(
      r=>
        String(r.rowId)===
        String(startRowId)
    );

  if(startIndex<0){
    return;
  }

  while(
    rows.length<
    startIndex+
    numbers.length
  ){

    const rowId=
      "row_"+
      Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2);

    let minCreated=
      Date.now();

    [
      ...data.db,
      ...data.g1
    ].forEach(
      item=>{

        const t=
          Number(item?.created);

        if(
          Number.isFinite(t)
        ){

          minCreated=
            Math.min(
              minCreated,
              t
            );

        }

      }
    );

    const created=
      minCreated-1;

    data.db.push({

      id:rowId+"_db",
      rowId:rowId,
      number:"",
      locked:false,
      created:created

    });

    data.g1.push({

      id:rowId+"_g1",
      rowId:rowId,
      number:"",
      locked:false,
      created:created

    });

    rows=
      buildRowsFromData(data);

  }

  const arr=
    type==="db"
      ?data.db
      :data.g1;

  numbers.forEach(
    (number,i)=>{

      if(!re.test(String(number))){
        return;
      }

      const row=
        rows[
          startIndex+i
        ];

      if(!row){
        return;
      }

      let item=
        arr.find(
          x=>
            x &&
            String(x.rowId)===
            String(row.rowId)
        );

      if(!item){

        item={

          id:
            "id_"+
            Date.now()+
            "_"+
            Math.random()
              .toString(36)
              .slice(2),

          rowId:row.rowId,
          number:"",
          locked:false,
          created:row.created

        };

        arr.push(item);

      }

      if(item.locked===true){
        return;
      }

      item.number=
        String(number);

      item.locked=true;

    }
  );

  saveAll(all);

}

/* =====================================================
   TẠO Ô NHẬP NGÀY
===================================================== */

function createDateInputRow(
  column,
  row
){

  const box=
    document.createElement("div");

  box.className="data-row";

  box.dataset.rowId=
    row.rowId||"";

  const input=
    document.createElement("input");

  input.type="text";
  input.inputMode="numeric";
  input.maxLength=500000;
  input.className="date-input";

  input.dataset.rowId=
    row.rowId||"";

  input.value=
    row.db?.sourceDateText ||
    row.g1?.sourceDateText ||
    row.db?.sourceDate ||
    row.g1?.sourceDate ||
    "";

  function normalizeDate(value){

    const s=
      String(value||"")
        .trim();

    const m=
      s.match(
        /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
      );

    if(!m){
      return "";
    }

    const day=
      m[1].padStart(2,"0");

    const month=
      m[2].padStart(2,"0");

    const year=
      m[3];

    return(
      day+
      "-"+
      month+
      "-"+
      year
    );

  }

  function parseDates(text){

    const raw=
      String(text||"")
        .replace(/\r/g,"\n");

    const parts=
      raw
        .split(/[\s,;]+/)
        .map(x=>x.trim())
        .filter(Boolean);

    const dates=[];

    parts.forEach(part=>{

      const date=
        normalizeDate(part);

      if(date){
        dates.push(date);
      }

    });

    return dates;

  }

  function saveSingleDate(date){

    const all=
      loadAll();

    const current=
      all[getKey()];

    if(!current){
      return;
    }

    const db=
      Array.isArray(current.db)
        ?current.db
        :[];

    const g1=
      Array.isArray(current.g1)
        ?current.g1
        :[];

    [
      ...db,
      ...g1
    ].forEach(item=>{

      if(
        item &&
        String(item.rowId)===
        String(row.rowId)
      ){

        item.sourceDate=
          date;

        if(date){

          const parts=
            date.split("-");

          if(parts.length===3){

            item.sourceDateText=
              parts[2]+"/"+
              parts[1]+"/"+
              parts[0];

          }

        }else{

          item.sourceDateText="";

        }

      }

    });

    saveAll(all);

  }

  function saveBulkDates(dates){

    if(
      !Array.isArray(dates) ||
      !dates.length
    ){
      return;
    }

    const all=
      loadAll();

    const key=
      getKey();

    if(!all[key]){

      all[key]={
        db:[],
        g1:[]
      };

    }

    const data=
      all[key];

    let rows=
      buildRowsFromData(data);

    const startIndex=
      rows.findIndex(
        r=>
          String(r.rowId)===
          String(row.rowId)
      );

    if(startIndex<0){
      return;
    }

    while(
      rows.length<
      startIndex+
      dates.length
    ){

      const rowId=
        "row_"+
        Date.now()+
        "_"+
        Math.random()
          .toString(36)
          .slice(2);

      let oldest=
        Date.now();

      [
        ...data.db,
        ...data.g1
      ].forEach(item=>{

        const t=
          Number(item?.created);

        if(
          Number.isFinite(t)
        ){

          oldest=
            Math.min(
              oldest,
              t
            );

        }

      });

      const created=
        oldest-1;

      data.db.push({

        id:rowId+"_db",
        rowId:rowId,
        number:"",
        locked:false,
        created:created,
        sourceDate:"",
        sourceDateText:""

      });

      data.g1.push({

        id:rowId+"_g1",
        rowId:rowId,
        number:"",
        locked:false,
        created:created,
        sourceDate:"",
        sourceDateText:""

      });

      rows=
        buildRowsFromData(data);

    }

    dates.forEach(
      (date,i)=>{

        const targetRow=
          rows[
            startIndex+i
          ];

        if(!targetRow){
          return;
        }

        const parts=
          date.split("-");

        const displayDate=
          parts.length===3
            ?(
              parts[2]+"/"+
              parts[1]+"/"+
              parts[0]
            )
            :"";

        [
          ...data.db,
          ...data.g1
        ].forEach(item=>{

          if(
            item &&
            String(item.rowId)===
            String(targetRow.rowId)
          ){

            item.sourceDate=
              date;

            item.sourceDateText=
              displayDate;

          }

        });

      }
    );

    saveAll(all);

  }

  input.addEventListener(
    "input",
    function(){

      const raw=
        String(input.value||"");

      const dates=
        parseDates(raw);

      if(dates.length>1){

        input.value="";

        saveBulkDates(dates);

        requestAnimationFrame(()=>{
          renderInputLists();
        });

        return;

      }

      if(dates.length===1){

        const date=
          dates[0];

        input.value=
          date;

        saveSingleDate(date);

        return;

      }

      let v=
        raw
          .replace(/\D/g,"")
          .slice(0,8);

      if(v.length>2){

        v=
          v.slice(0,2)+
          "-"+
          v.slice(2);

      }

      if(v.length>5){

        v=
          v.slice(0,5)+
          "-"+
          v.slice(5);

      }

      input.value=v;

    }
  );

  input.addEventListener(
    "paste",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      let text="";

      try{

        text=
          e.clipboardData
            ?(
              e.clipboardData.getData("text/plain") ||
              e.clipboardData.getData("text") ||
              ""
            )
            :"";

      }catch(err){

        text="";

      }

      const dates=
        parseDates(text);

      if(!dates.length){
        return;
      }

      if(dates.length===1){

        input.value=
          dates[0];

        saveSingleDate(
          dates[0]
        );

        return;

      }

      saveBulkDates(dates);

      input.value="";

      requestAnimationFrame(()=>{
        renderInputLists();
      });

    },
    true
  );

  input.addEventListener(
    "change",
    function(){

      const date=
        normalizeDate(
          input.value
        );

      if(!date){

        input.value="";
        saveSingleDate("");
        return;

      }

      input.value=
        date;

      saveSingleDate(
        date
      );

      loadLatest();

    }
  );

  box.appendChild(input);
  column.appendChild(box);

}

/* =====================================================
   TẠO Ô NHẬP DB / G1
===================================================== */

function createInputRow(
  column,
  type,
  item,
  rowId
){

  const maxDigits =
    digitLength(type);

  const digitRe =
    new RegExp(
      "^\\d{" + maxDigits + "}$"
    );

  const row =
    document.createElement("div");

  row.className = "data-row";

  row.dataset.rowId =
    rowId || "";

  row.dataset.type =
    type;

  const input =
    document.createElement("textarea");

  input.className = "row-input";

  if(type === "db"){
    input.classList.add("db-input");
  }

  if(type === "g1"){
    input.classList.add("g1-input");
  }

  input.inputMode = "numeric";

  input.maxLength = 50000;

  input.rows = 1;

  input.wrap = "off";

  input.autocomplete = "off";

  input.spellcheck = false;

  input.setAttribute(
    "enterkeyhint",
    "next"
  );

  input.dataset.rowId =
    rowId || "";

  input.dataset.type =
    type;

  input.value =
    item
      ? String(item.number || "")
      : "";

  /*
    KHÔNG tự khóa khi nhập đủ số.
    Cho phép người dùng sửa lại số đã nhập sai.
  */

  input.readOnly = false;

  input.classList.remove("locked");


  row.appendChild(input);

  column.appendChild(row);


  /* =========================
     PASTE
     ========================= */

  input.addEventListener(
    "paste",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      const text =
        e.clipboardData
          ? e.clipboardData.getData("text")
          : "";

      const numbers =
        parsePasteNumbers(
          text,
          type
        );

      if(!numbers.length){
        return;
      }


      if(numbers.length > 1){

        pasteNumbers(
          type,
          rowId,
          numbers
        );

        input.value = "";

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

        return;
      }


      if(numbers.length === 1){

        const number =
          numbers[0];

        if(item){

          updateItem(
            type,
            item.id,
            number
          );

        }else{

          addNumber(
            type,
            number,
            rowId
          );

        }

        /*
          KHÔNG lock ở đây.
          Cho phép sửa tiếp nếu nhập nhầm.
        */

        input.readOnly = false;

        input.classList.remove(
          "locked"
        );

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

      }

    },
    true
  );


  /* =========================
     INPUT
     ========================= */

  input.addEventListener(
    "input",
    function(){

      const raw =
        String(
          input.value || ""
        );


      const bulkNumbers =
        parsePasteNumbers(
          raw,
          type
        );


      if(
        bulkNumbers.length > 1
      ){

        pasteNumbers(
          type,
          rowId,
          bulkNumbers
        );

        input.value = "";

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

        return;
      }


      if(
        bulkNumbers.length === 1 &&
        /[\s,;\n\r]/.test(raw)
      ){

        pasteNumbers(
          type,
          rowId,
          bulkNumbers
        );

        input.value = "";

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

        return;
      }


      let value =
        raw
          .replace(/\D/g,"")
          .slice(0,maxDigits);


      input.value = value;


      if(item){

        updateItem(
          type,
          item.id,
          value
        );

        /*
          QUAN TRỌNG:
          Không lock khi đủ số.
        */

        return;
      }


      /*
        Dòng mới:
        nhập đủ số thì tạo dữ liệu,
        nhưng vẫn để ô nhập mở để sửa.
      */

      if(
        value.length === maxDigits
      ){

        addNumber(
          type,
          value,
          rowId
        );

        input.readOnly = false;

        input.classList.remove(
          "locked"
        );

      }

    }
  );


  /* =========================
     ENTER
     ========================= */

  input.addEventListener(
    "keydown",
    function(e){

      if(e.key !== "Enter"){
        return;
      }

      e.preventDefault();


      const value =
        input.value
          .replace(/\D/g,"")
          .slice(0,maxDigits);


      input.value = value;


      if(
        value.length !== maxDigits
      ){
        return;
      }


      if(item){

        updateItem(
          type,
          item.id,
          value
        );

      }else{

        addNumber(
          type,
          value,
          rowId
        );

      }


      /*
        KHÔNG khóa ô sau khi Enter.
        Vẫn cho phép sửa.
      */

      input.readOnly = false;

      input.classList.remove(
        "locked"
      );


      if(document.activeElement){
        document.activeElement.blur();
      }


      renderInputLists();

    }
  );

}

/* =====================================================
   KHÓA ITEM
===================================================== */

function lockItem(
  type,
  id
){

  if(!id){
    return;
  }

  const maxDigits=
    digitLength(type);

  const re=
    new RegExp(
      "^\\d{"+maxDigits+"}$"
    );

  const all=
    loadAll();

  const current=
    all[getKey()];

  if(!current){
    return;
  }

  const arr=
    type==="db"
      ?current.db
      :current.g1;

  const item=
    arr.find(
      x=>x.id===id
    );

  if(!item){
    return;
  }

  if(
    re.test(
      String(item.number||"")
    )
  ){

    item.locked=true;

    saveAll(all);

  }

}

/* =====================================================
   CẬP NHẬT ITEM
===================================================== */

function updateItem(
  type,
  id,
  number
){

  const maxDigits=
    digitLength(type);

  const all=
    loadAll();

  const current=
    all[getKey()];

  if(!current){
    return;
  }

  const arr=
    type==="db"
      ?current.db
      :current.g1;

  const item=
    arr.find(
      x=>x.id===id
    );

  if(!item){
    return;
  }

  if(item.locked===true){
    return;
  }

  item.number=
    String(number)
      .replace(/\D/g,"")
      .slice(0,maxDigits);

  if(
    item.number.length===maxDigits
  ){

    item.locked=true;

  }

  saveAll(all);

}

/* =====================================================
   THÊM SỐ
===================================================== */

function addNumber(
  type,
  number,
  rowId
){

  const maxDigits=
    digitLength(type);

  number=
    String(number)
      .replace(/\D/g,"")
      .slice(0,maxDigits);

  if(
    number.length!==maxDigits
  ){
    return;
  }

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  const current=
    all[key];

  const now=
    Date.now();

  const id=
    now+
    "_"+
    Math.random()
      .toString(36)
      .slice(2);

  let finalRowId=
    rowId;

  if(!finalRowId){

    finalRowId=
      "row_"+
      now+
      "_"+
      Math.random()
        .toString(36)
        .slice(2);

  }

  const arr=
    type==="db"
      ?current.db
      :current.g1;

  const existing=
    arr.find(
      x=>
        x &&
        String(x.rowId)===
        String(finalRowId)
    );

  if(existing){

    if(existing.locked===true){
      return;
    }

    existing.number=
      number;

    existing.locked=true;

    saveAll(all);

    return;

  }

  arr.push({

    id:id,
    rowId:finalRowId,
    number:number,
    locked:true,
    created:now

  });

  saveAll(all);

}

/* =====================================================
   THÊM HÀNG TRÊN
===================================================== */

function addRowTop(){

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  const now=
    Date.now();

  const row=
    createRowData(now);

  all[key].db.push(
    row.db
  );

  all[key].g1.push(
    row.g1
  );

  saveAll(all);

  if(document.activeElement){
    document.activeElement.blur();
  }

  renderInputLists();

}

/* =====================================================
   THÊM HÀNG DƯỚI
===================================================== */

function addRowBottom(){

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  const data=
    all[key];

  let oldest=
    Date.now();

  [
    ...data.db,
    ...data.g1
  ].forEach(
    item=>{

      const t=
        Number(item?.created);

      if(
        Number.isFinite(t)
      ){

        oldest=
          Math.min(
            oldest,
            t
          );

      }

    }
  );

  const created=
    oldest-1;

  const row=
    createRowData(created);

  data.db.push(
    row.db
  );

  data.g1.push(
    row.g1
  );

  saveAll(all);

  if(document.activeElement){
    document.activeElement.blur();
  }

  renderInputLists();

}

/* =====================================================
   NÚT THÊM
===================================================== */

document
  .getElementById("addTop")
  .addEventListener(
    "click",
    e=>{

      e.preventDefault();

      if(document.activeElement){
        document.activeElement.blur();
      }

      addRowTop();

    }
  );

document
  .getElementById("addBottom")
  .addEventListener(
    "click",
    e=>{

      e.preventDefault();

      if(document.activeElement){
        document.activeElement.blur();
      }

      addRowBottom();

    }
  );
window.addEventListener(
  "online",
  ()=>{
    syncOnlineResults();
  }
);
/* =====================================================
   KHỞI ĐỘNG
===================================================== */

renderStations();

/* Đồng bộ toàn bộ dữ liệu Worker khi mở app */
syncOnlineResults();

</script>
